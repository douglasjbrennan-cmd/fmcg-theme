name: Queue Article for Publishing

# Adds a new article entry to articles/queue.json.
# The FMCG Article Publisher WordPress plugin polls that file hourly and
# publishes any pending entries automatically — no inbound access to WordPress needed.

on:
  workflow_dispatch:
    inputs:
      article_id:
        description: "Unique slug for the article (e.g. my-article-title)"
        required: true
      title:
        description: "Article title"
        required: true
      category_slug:
        description: "Category slug (e.g. branding)"
        required: true
        default: "uncategorized"
      category_name:
        description: "Category display name (e.g. Branding)"
        required: true
        default: "Uncategorized"
      excerpt:
        description: "Short excerpt (optional)"
        required: false
        default: ""
      content:
        description: "Full article HTML/block content"
        required: true

jobs:
  queue:
    name: Add article to queue
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate article ID is not already queued
        run: |
          ID="${{ inputs.article_id }}"
          if python3 -c "
          import json, sys
          queue = json.load(open('articles/queue.json'))
          ids = [a['id'] for a in queue]
          if '$ID' in ids:
              print(f'ERROR: article ID \"$ID\" already exists in queue.json')
              sys.exit(1)
          print(f'ID \"$ID\" is new — OK to add')
          "; then
            echo "Validation passed"
          else
            exit 1
          fi

      - name: Append article to queue.json
        run: |
          python3 - <<'PYEOF'
          import json, os

          with open('articles/queue.json', 'r') as f:
              queue = json.load(f)

          queue.append({
              "id":            os.environ["ARTICLE_ID"],
              "status":        "pending",
              "title":         os.environ["TITLE"],
              "excerpt":       os.environ["EXCERPT"],
              "category_slug": os.environ["CATEGORY_SLUG"],
              "category_name": os.environ["CATEGORY_NAME"],
              "content":       os.environ["CONTENT"],
          })

          with open('articles/queue.json', 'w') as f:
              json.dump(queue, f, indent=2, ensure_ascii=False)

          print(f"Added '{os.environ['TITLE']}' to queue.json ({len(queue)} total entries)")
          PYEOF
        env:
          ARTICLE_ID:    ${{ inputs.article_id }}
          TITLE:         ${{ inputs.title }}
          EXCERPT:       ${{ inputs.excerpt }}
          CATEGORY_SLUG: ${{ inputs.category_slug }}
          CATEGORY_NAME: ${{ inputs.category_name }}
          CONTENT:       ${{ inputs.content }}

      - name: Commit and push updated queue
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles/queue.json
          git commit -m "Queue article: ${{ inputs.title }}"
          git push
